<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="description" content="Check your CODEX 4.0 registration and payment status.">
  <title>Check Registration | CODEX 4.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    .lookup-wrap{max-width:760px;margin:0 auto;padding:120px 20px 70px}
    .lookup-card{background:var(--surface,#151515);border:1px solid var(--border,#303030);border-radius:18px;padding:32px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
    .lookup-form{display:grid;gap:16px;margin-top:26px}.lookup-form label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
    .lookup-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid var(--border,#303030);border-radius:10px;background:var(--bg,#0d0d0d);color:var(--text,#fff);font:inherit}
    .lookup-form input:focus{outline:2px solid var(--accent,#ff6b00);outline-offset:1px}.lookup-btn{border:0;border-radius:10px;padding:15px 18px;background:var(--accent,#ff6b00);color:#fff;font-weight:800;cursor:pointer}.lookup-btn:disabled{opacity:.6;cursor:wait}
    .lookup-message{min-height:22px;margin-top:16px;color:var(--muted);font-size:14px}.lookup-message.error{color:#ff7b7b}.lookup-message.success{color:#79e6a0}
    .result{display:none;margin-top:26px;border-top:1px solid var(--border,#303030);padding-top:26px}.result.show{display:block}.result-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.result h3{margin:4px 0;font-size:25px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.result-item{padding:15px;border:1px solid var(--border,#303030);border-radius:10px}.result-item span{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:7px}.result-item strong{word-break:break-word}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#1d1d1d;border:1px solid var(--border,#303030);font-size:11px;font-weight:800;text-transform:uppercase}.badge.paid{color:#79e6a0;border-color:#286b47}.badge.pending{color:#ffd479}.badge.failed,.badge.rejected{color:#ff7b7b}.pass-btn{display:inline-block;margin-top:20px;text-decoration:none;padding:12px 16px;border:1px solid var(--border,#303030);border-radius:9px;color:var(--text,#fff);font-weight:700}
    @media(max-width:600px){.lookup-wrap{padding-top:95px}.lookup-card{padding:22px}.result-grid{grid-template-columns:1fr}.result-head{display:block}}
  </style>
</head>
<body>
  <div class="bg-grid"></div><div id="navbar"></div>
  <main class="lookup-wrap">
    <div class="section-title"><span class="kicker">REGISTRATION STATUS</span><h1>Check your registration.</h1><p>Enter your Registration ID and the team leader's email to securely view your registration and payment status.</p></div>
    <section class="lookup-card" aria-labelledby="lookup-title">
      <h2 id="lookup-title">Registration Lookup</h2>
      <form id="lookupForm" class="lookup-form" novalidate>
        <div><label for="registrationId">REGISTRATION ID</label><input id="registrationId" name="registrationId" autocomplete="off" required maxlength="80" placeholder="e.g. CODEX-XXXXXX"></div>
        <div><label for="leaderEmail">TEAM LEADER EMAIL</label><input id="leaderEmail" name="leaderEmail" type="email" autocomplete="email" required maxlength="254" placeholder="leader@example.com"></div>
        <button id="lookupBtn" class="lookup-btn" type="submit">CHECK STATUS →</button>
      </form>
      <div id="message" class="lookup-message" role="status" aria-live="polite"></div><div id="result" class="result" aria-live="polite"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="theme.js"></script><script src="js/core/page-shell.js"></script><script src="js/registration/status-lookup.js"></script>
</body>
</html>
